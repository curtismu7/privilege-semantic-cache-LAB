# OrbStack:  HOST_PORT=7847 docker compose up --build -d   ->  http://127.0.0.1:7847
# The server binds 0.0.0.0 INSIDE the container (PSC_BIND is the opt-in), but the port is published on loopback only.
# Do not change the 127.0.0.1 below. 7847 is PROVISIONAL (claimed provisionally, not registered on the board yet); HOST_PORT stays in 7800-7999.
# Branding (customer.config.json, git-ignored; the root file system is read-only): copy customer.config.example.json to customer.config.json beside this file
# and uncomment the volume below. Without it the lab uses its built-in branding and vocabulary.
name: privilege-semantic-cache-lab

services:
  privilege-semantic-cache-lab:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT:-7847}:7847"
    environment:
      PORT: "7847"
      PSC_BIND: 0.0.0.0
      LAB_ALLOWED_HOSTS: ${LAB_ALLOWED_HOSTS:-}
    # volumes:
    #   - ./customer.config.json:/app/customer.config.json:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7847/api/health').then(r=>r.json()).then(j=>process.exit(j.schema==='demo-health/1'&&j.state==='ready'?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      start_period: 5s
      start_interval: 2s
      timeout: 5s
      retries: 3
